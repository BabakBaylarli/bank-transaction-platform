name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (unit + Testcontainers + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn clean verify
        run: ./mvnw -B -ntp clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            e2e-tests/target/e2e-logs/
          retention-days: 7

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images & compose config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Validate docker-compose.prod.yml
        run: |
          cp .env.prod.example .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-only-secret-ci-only-secret-ci-only-secret/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/; s/^KIBANA_PASSWORD=.*/KIBANA_PASSWORD=ci/' .env
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build images
        run: docker compose -f docker-compose.prod.yml build
