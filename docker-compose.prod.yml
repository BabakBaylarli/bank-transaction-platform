# Production stack for ONE small VM (Oracle Cloud Always Free: ARM64 Ampere A1, 2 OCPU / 12 GB RAM).
#
#   cp .env.prod.example .env   # fill in DOMAIN and the secrets
#   ./deploy/deploy.sh          # or: docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports (80/443). Postgres, Kafka, Elasticsearch, Kibana and the services
# are reachable exclusively on the internal Docker network.
#
# Memory budget (limits), ~7.5 GB of 12 GB - leaves room for the OS, page cache and builds:
#   elasticsearch 2 GB (heap 1 GB) · kibana 1.2 GB · kafka 1 GB (heap 512 MB) · postgres 512 MB
#   3 × spring service 768 MB · frontend 64 MB · caddy 128 MB
name: bank-platform-prod

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-spring-service: &spring-service
  <<: [*restart, *logging]
  environment: &spring-env
    SPRING_PROFILES_ACTIVE: prod
    # public demo: seed admin/alice/bob (and re-seed after the nightly reset)
    DEMO_MODE: ${DEMO_MODE:-true}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bank}
    DB_USERNAME: ${POSTGRES_USER:-bank}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ELASTICSEARCH_URIS: http://elasticsearch:9200
    # required only while DEMO_MODE=true (transaction-service refuses to seed without them)
    SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-}
    LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    # container limit 768 MB -> heap up to ~576 MB; Serial GC is the leanest choice on 2 vCPUs
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -Xss512k
  deploy:
    resources:
      limits:
        memory: 768M

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:17-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bank}
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60", "-c", "work_mem=4MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  kafka:
    image: apache/kafka:3.9.1
    <<: [*restart, *logging]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1G

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    <<: [*restart, *logging]
    environment:
      discovery.type: single-node
      # not reachable from outside the Docker network; Kibana is protected by Caddy basic auth
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      cluster.routing.allocation.disk.watermark.low: 90%
      cluster.routing.allocation.disk.watermark.high: 95%
      cluster.routing.allocation.disk.watermark.flood_stage: 97%
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 2G

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.8
    <<: [*restart, *logging]
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      # served under https://<DOMAIN>/kibana/ behind Caddy basic auth
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: ${PUBLIC_ORIGIN:-https://${DOMAIN:?Set DOMAIN in .env}}/kibana
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"
      NEWSFEED_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=800
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/kibana/api/status | grep -q '\"level\":\"available\"'"]
      interval: 15s
      timeout: 10s
      retries: 40
    deploy:
      resources:
        limits:
          memory: 1200M

  # one-shot job: imports the "Transactions Overview" dashboard, then exits
  kibana-init:
    image: curlimages/curl:8.11.1
    entrypoint: ["/bin/sh", "/kibana/init.sh"]
    environment:
      KIBANA_URL: http://kibana:5601/kibana
    volumes:
      - ./kibana:/kibana:ro
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------- application
  transaction-service:
    <<: *spring-service
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    image: bank-platform/transaction-service:latest
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10

  processing-service:
    <<: *spring-service
    build:
      context: .
      dockerfile: processing-service/Dockerfile
    image: bank-platform/processing-service:latest
    depends_on:
      transaction-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10

  search-service:
    <<: *spring-service
    build:
      context: .
      dockerfile: search-service/Dockerfile
    image: bank-platform/search-service:latest
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10

  frontend:
    <<: [*restart, *logging]
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_KIBANA_URL: /kibana/app/dashboards#/view/transactions-overview
        VITE_DEMO_MODE: ${DEMO_MODE:-true}
        VITE_DEMO_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD}
        VITE_DEMO_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    image: bank-platform/frontend:latest
    deploy:
      resources:
        limits:
          memory: 64M

  # ---------------------------------------------------------------- edge
  caddy:
    build:
      context: deploy/caddy
    image: bank-platform/caddy:latest
    <<: [*restart, *logging]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env (Let's Encrypt expiry notices)}
      # override both only for local testing over plain HTTP (see DEPLOY.md)
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://${DOMAIN}}
      KIBANA_USER: ${KIBANA_USER:-admin}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?Set KIBANA_PASSWORD in .env}
      RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-10}
      RATE_LIMIT_TRANSFERS_PER_MIN: ${RATE_LIMIT_TRANSFERS_PER_MIN:-30}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - transaction-service
      - processing-service
      - search-service
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres-data:
  kafka-data:
  es-data:
  caddy-data:
  caddy-config:
