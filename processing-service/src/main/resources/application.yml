server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: processing-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank}
    username: ${DB_USERNAME:bank}
    password: ${DB_PASSWORD:bank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # processing-service owns only its own schema; the accounts table belongs to transaction-service
    schemas: processing
    default-schema: processing
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: processing-service
      auto-offset-reset: earliest
      properties:
        max.poll.interval.ms: 120000

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
  openapi:
    description: "Consumes transfers, runs fraud rules and moves money atomically. Retries with backoff, then DLT."
  fraud:
    max-single-amount: ${FRAUD_MAX_SINGLE_AMOUNT:10000.00}
    daily-limit: ${FRAUD_DAILY_LIMIT:20000.00}
    max-transactions-per-minute: ${FRAUD_MAX_TX_PER_MINUTE:5}
  kafka:
    listener-concurrency: 3
    retry:
      max-attempts: 4
      initial-interval: 1s
      max-interval: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    org.apache.kafka: WARN
