server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: search-service
  threads:
    virtual:
      enabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: search-service
      auto-offset-reset: earliest

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
  openapi:
    description: "Elasticsearch read model of all transactions: filtered full-text search and ADMIN aggregations."
  kafka:
    listener-concurrency: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    org.apache.kafka: WARN
