server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: transaction-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank}
    username: ${DB_USERNAME:bank}
    password: ${DB_PASSWORD:bank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: transaction-service
      auto-offset-reset: earliest

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      ttl: ${JWT_TTL:PT1H}
  openapi:
    description: "Public API: registration/login, accounts, idempotent transfers (transactional outbox to Kafka)."
  outbox:
    batch-size: 100
    poll-interval: 500ms
    retention: P7D

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    org.apache.kafka: WARN
